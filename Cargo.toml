[package]
name = "dream-soft-render"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
description = "Deterministic CPU rasterizer for 2D meshes and egui frames, writing premultiplied RGBA8"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DreamWeave-MP/dream-soft-render"
homepage = "https://dreamweave-mp.github.io/dream-soft-render/"
documentation = "https://dreamweave-mp.github.io/dream-soft-render/docs/"
readme = "README.md"
keywords = ["rasterizer", "software-renderer", "egui", "framebuffer", "rgba"]
categories = ["graphics", "gui", "rendering"]
# The repository is also the crate's documentation site; the package is the crate alone.
include = ["/src", "/benches", "/tests", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = []
# The egui adapter: SoftwareRenderer::render_egui and everything in egui_adapter.
egui = ["dep:egui"]

[dependencies]
egui = { version = "0.34", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "golden"
required-features = ["egui"]

[[bench]]
name = "draw"
harness = false

[[bench]]
name = "frame"
harness = false
required-features = ["egui"]

# Thin LTO in this crate's own release builds and benchmarks. Where .cargo/config.toml passes
# -Clinker-plugin-lto (Linux, Windows) lld runs it; on macOS rustc does. Dependents set their own.
[profile.release]
lto = "thin"
