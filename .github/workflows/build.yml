name: Library CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # Keep branch pushes restricted to main. Non-tag pushes publish to the shared
    # "development" release, so feature branches will compete for the same release.
    branches: main
    tags: ['*']

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/libGlobalBuild.yml@v53
    secrets: inherit
    with:
      crate_names: '["dream-soft-render"]'

      # Dream-INI renders its PortMaster GUI through this crate.
      dependent_repo_names: |
        DreamWeave-MP/dream-ini

      # rust-version in Cargo.toml follows egui's, which is the real floor.
      msrv: auto

      # Plain cargo bench runs benches/draw.rs (frame.rs needs the egui feature). It is a custom
      # harness, so the release gets the raw benchmark log.
      generate_benchmarks: true

      # StroggForge records each version crates.io has in content/home/mod.lock and deploys this
      # site, the crate's documentation, in place of rustdoc Pages.
      mod_template: true
